name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - name: Verify tag and package identity
        run: node scripts/verify-release.js "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run lint
      - run: npm pack --dry-run --json
      - name: Publish public package with provenance
        run: npm publish --access public --provenance
      - name: Verify public registry and clean npx execution
        shell: bash
        env:
          PACKAGE_NAME: "@kkx94/oss-init"
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for attempt in {1..30}; do
            actual="$(npm view "$PACKAGE_NAME@$expected" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)"
            if [ "$actual" = "$expected" ]; then
              clean_dir="$(mktemp -d)"
              cd "$clean_dir"
              cli_version="$(npx --yes --package "$PACKAGE_NAME@$expected" oss-init --version)"
              if [ "$cli_version" = "$expected" ]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Published package did not pass public registry and clean npx verification."
          exit 1
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
