name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm test
      - run: npm run lint

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm test
      - run: npm run lint

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm pack --dry-run --json

  CI:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, windows, package]
    if: always()
    steps:
      - name: Require every test and package job
        if: ${{ needs.test.result != 'success' || needs.windows.result != 'success' || needs.package.result != 'success' }}
        run: exit 1
      - run: echo "All required jobs passed."
