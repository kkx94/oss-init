name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run lint

  # Aggregate job whose check-run name matches the branch protection
  # required_status_check context "CI". Branch protection requires "CI",
  # not "test (18.x)" / "test (20.x)" / "test (22.x)".
  CI:
    name: CI
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Report aggregate result
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "One or more test matrix jobs failed."
          exit 1
      - name: All green
        run: echo "All test matrix jobs passed."